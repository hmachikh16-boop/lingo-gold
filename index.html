<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingo Gold — Immersion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="loading" id="loading">
    <div style="text-align:center">
      <div style="font-size:38px">🌊</div>
      <p class="prompt" style="margin-top:10px">جارٍ تجهيز الدروس...</p>
    </div>
  </div>

  <!-- ============ HOME ============ -->
  <div id="home">
    <header class="home-top">
      <div class="hbrand"><span class="hmark">LG</span><span>Lingo Gold</span></div>
      <div class="hmeta">تقدّمك: <span id="homeProgress">0 / 48</span></div>
    </header>
    <div class="home">
      <aside class="side">
        <h4>المستويات</h4>
        <div id="sideLevels"></div>
        <h4 style="margin-top:18px">أدوات</h4>
        <button class="lv" id="reviewBtn">↻ مراجعة</button>
      </aside>
      <main class="main">
        <h1 id="homeTitle">الوحدة</h1>
        <p class="lead" id="homeLead">تعلّم بالصورة والسياق</p>
        <div class="section-t">دروس الوحدة <span>9 تمارين متتابعة</span></div>
        <div class="path" id="pathGrid"></div>
        <div class="section-t">الاختبارات <span>75% للنجاح</span></div>
        <div class="tests" id="testRow"></div>
      </main>
    </div>
  </div>

  <!-- ============ FULL-SCREEN LESSON ============ -->
  <section class="lesson" id="lesson">
    <div class="l-top">
      <button class="x" id="exitBtn" title="خروج">✕</button>
      <div class="segs" id="segBar"></div>
      <span class="l-count" id="lCount">1/9</span>
    </div>
    <div class="l-body">
      <div class="l-inner">
        <div class="prompt" id="lPrompt">الملاحظة</div>
        <div id="lStage" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px"></div>
      </div>
    </div>
    <div class="l-foot">
      <div class="note" id="lNote"></div>
      <button class="go" id="goBtn" disabled>متابعة ←</button>
    </div>
  </section>

  <!-- ============ TEST MODAL ============ -->
  <section class="lesson" id="testModal" style="background:#fafaf9">
    <div class="l-top">
      <button class="x" id="testCloseX">✕</button>
      <div class="segs"></div>
      <span class="l-count">TEST</span>
    </div>
    <div class="l-body">
      <div class="l-inner" id="testArea"></div>
    </div>
  </section>

  <!-- ============ REVIEW MODAL ============ -->
  <section class="lesson" id="reviewModal" style="background:#fafaf9">
    <div class="l-top">
      <button class="x" id="reviewCloseX">✕</button>
      <div class="segs"></div>
      <span class="l-count">↻</span>
    </div>
    <div class="l-body">
      <div class="l-inner" id="reviewArea"></div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <script src="curriculum.js"></script>
  <script src="app.js"></script>
</body>
</html>
