<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingo Gold</title>
    <style>
        /* ================= 1. التصميم الأساسي ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f4f4; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* الشريط العلوي */
        .top-bar { background-color: #222; color: #ccc; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .logo { color: #f1c40f; font-weight: bold; font-size: 18px; }

        /* الحاوية الرئيسية */
        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; }

        /* ================= 2. واجهة المنهج (Curriculum) ================= */
        .curriculum-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 1000px; width: 100%; }
        .unit-card { background: #f4d03f; border-radius: 8px; padding: 15px; height: 120px; color: white; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .unit-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        .unit-title { font-size: 16px; font-weight: bold; z-index: 2; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .unit-icon { position: absolute; right: -10px; bottom: -10px; width: 80px; height: 80px; background-size: cover; opacity: 0.5; z-index: 1; }

        /* ================= 3. واجهة المسار (Dashboard) ================= */
        .polaroid-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 40px; height: 200px; }
        .polaroid { background: white; padding: 8px 8px 25px 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: transform 0.3s; cursor: pointer; }
        .polaroid:nth-child(1) { transform: rotate(-8deg) translateY(10px); }
        .polaroid:nth-child(2) { transform: rotate(4deg) translateY(-5px); }
        .polaroid:nth-child(3) { transform: rotate(-3deg) translateY(15px); }
        .polaroid:nth-child(4) { transform: rotate(7deg) translateY(-10px); }
        .polaroid:nth-child(5) { transform: rotate(-5deg) translateY(5px); }
        .polaroid:hover { transform: scale(1.15) rotate(0deg) !important; z-index: 10; }
        .polaroid img { width: 130px; height: 130px; object-fit: cover; background: #eee; }

        .path-container { display: flex; gap: 15px; margin-top: 20px; }
        .node { width: 40px; height: 40px; border-radius: 50%; background: #ddd; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; }
        .node.active { background: #f1c40f; color: white; }
        .node.completed { background: #2ecc71; color: white; }

        /* ================= 4. واجهة التمارين (Exercises) ================= */
        .exercise-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; display: flex; flex-direction: column; border: 3px solid transparent; overflow: hidden; }
        .card.correct { border-color: #2ecc71; }
        .card.wrong { border-color: #e74c3c; animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

        .fill-header { padding: 20px; font-size: 22px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .blank-input { border: 1px solid #ccc; padding: 5px 10px; border-radius: 4px; font-size: 20px; width: 120px; text-align: center; margin: 0 10px; }

        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .choice-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 3px solid transparent; }
        .choice-img:hover { transform: scale(1.02); }

        .text-options { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .text-option { padding: 15px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .text-option:hover { background: #f0f0f0; }

        .card-image { width: 100%; max-height: 350px; object-fit: cover; }

        .next-btn { margin-top: 20px; padding: 12px 40px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; display: none; }
        .next-btn.show { display: block; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">Lingo Gold</div>
        <div id="headerInfo">Loading...</div>
        <div>Sign Out</div>
    </div>

    <div class="main-content">
        <!-- 1. واجهة المنهج -->
        <div id="curriculumScreen" class="screen active">
            <h2 style="margin-bottom: 20px; color: #333;">Select a Unit</h2>
            <div class="curriculum-grid">
                <div class="unit-card" style="background-color: #f4d03f;" onclick="goToDashboard()">
                    <div class="unit-title">Unit 1: Language Basics</div>
                </div>
                <div class="unit-card" style="background-color: #5dade2;">
                    <div class="unit-title">Unit 2: Greetings</div>
                </div>
                <div class="unit-card" style="background-color: #e74c3c;">
                    <div class="unit-title">Unit 3: Work and School</div>
                </div>
            </div>
        </div>

        <!-- 2. واجهة المسار -->
        <div id="dashboardScreen" class="screen">
            <h2>Unit 1: Core Lessons</h2>
            <div class="path-container" id="pathContainer"></div>

            <div class="polaroid-container">
                <div class="polaroid"><img src="media/images/img_four_boys.jpg" onerror="this.src='media/images/img_house.jpg'"></div>
                <div class="polaroid"><img src="media/images/img_one_car.jpg" onerror="this.src='media/images/img_house.jpg'"></div>
                <div class="polaroid"><img src="media/images/img_one_dog.jpg" onerror="this.src='media/images/img_house.jpg'"></div>
                <div class="polaroid"><img src="media/images/img_one_apple.jpg" onerror="this.src='media/images/img_house.jpg'"></div>
                <div class="polaroid"><img src="media/images/img_market.jpg" onerror="this.src='media/images/img_house.jpg'"></div>
            </div>
        </div>

        <!-- 3. واجهة التمارين -->
        <div id="exerciseScreen" class="screen">
            <div class="exercise-container" id="exerciseContainer"></div>
            <button class="next-btn" id="nextBtn" onclick="nextExercise()">Next ➔</button>
        </div>
    </div>

    <script>
        let appData = null;
        let currentExerciseIndex = 0;
        let currentLesson = null;

        // تحميل البيانات
        fetch('data.rsd')
            .then(res => res.json())
            .then(data => {
                appData = data;
                currentLesson = data.units[0].lessons[0];
                document.getElementById('headerInfo').innerText = 'English (American) - Level 1';
                buildDashboardPath();
            })
            .catch(err => console.error("خطأ في قراءة data.rsd:", err));

        // التنقل بين الشاشات
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goToDashboard() {
            showScreen('dashboardScreen');
        }

        // بناء نقاط المسار
        function buildDashboardPath() {
            const container = document.getElementById('pathContainer');
            container.innerHTML = '';
            appData.units[0].lessons.forEach((lesson, index) => {
                const node = document.createElement('div');
                node.className = index === 0 ? 'node active' : 'node';
                node.innerText = index + 1;
                node.onclick = () => startLesson(index);
                container.appendChild(node);
            });
        }

        // بدء الدرس
        function startLesson(lessonIndex) {
            currentLesson = appData.units[0].lessons[lessonIndex];
            currentExerciseIndex = 0;
            showScreen('exerciseScreen');
            document.getElementById('headerInfo').innerText = currentLesson.title;
            renderExercise();
        }

        // عرض التمرين الحالي
        function renderExercise() {
            const container = document.getElementById('exerciseContainer');
            container.innerHTML = '';
            document.getElementById('nextBtn').classList.remove('show');

            const ex = currentLesson.exercises[currentExerciseIndex];
            const card = document.createElement('div');
            card.className = 'card';

            if (ex.type === 'fill_blank') {
                card.innerHTML = `
                    <div class="fill-header">
                        <div>${ex.sentence.replace('___', `<input type="text" class="blank-input" oninput="checkFill(this, '${ex.answer}')">`)}</div>
                        <button>🔊</button>
                    </div>
                    <img src="${ex.image}" class="card-image" onerror="this.style.display='none'">
                `;
            }
            else if (ex.type === 'choose_image') {
                let optionsHtml = ex.options.map(img => `<img src="${img}" class="choice-img" onclick="checkChoice(this, '${img}', '${ex.answer}')">`).join('');
                card.innerHTML = `
                    <div class="fill-header">
                        <span>🔊 Listen and choose: <strong>${ex.question}</strong></span>
                    </div>
                    <div class="choice-grid">${optionsHtml}</div>
                `;
            }
            else if (ex.type === 'choose_text') {
                let optionsHtml = ex.options.map(text => `<div class="text-option" onclick="checkChoice(this, '${text}', '${ex.answer}')">${text}</div>`).join('');
                card.innerHTML = `
                    <img src="${ex.image}" class="card-image" onerror="this.style.display='none'">
                    <div class="text-options">${optionsHtml}</div>
                `;
            }
            container.appendChild(card);
        }

        function checkFill(input, answer) {
            const card = input.closest('.card');
            if (input.value.trim().toLowerCase() === answer.toLowerCase()) {
                card.classList.add('correct');
                card.classList.remove('wrong');
                document.getElementById('nextBtn').classList.add('show');
            } else {
                card.classList.remove('correct');
            }
        }

        function checkChoice(el, selected, correct) {
            const card = el.closest('.card');
            if (selected === correct) {
                card.classList.add('correct');
                card.classList.remove('wrong');
                document.getElementById('nextBtn').classList.add('show');
            } else {
                card.classList.add('wrong');
                setTimeout(() => card.classList.remove('wrong'), 500);
            }
        }

        function nextExercise() {
            currentExerciseIndex++;
            if (currentExerciseIndex < currentLesson.exercises.length) {
                renderExercise();
            } else {
                alert("Lesson Completed!");
                showScreen('dashboardScreen');
            }
        }
    </script>
</body>
</html>
