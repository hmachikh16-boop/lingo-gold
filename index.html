<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Gold — Learning Engine</title>
  <style>
    /* ============================================================
       Lingo Gold — واجهة تعلم كاملة (Curriculum / Dashboard / Exercises)
       كل البيانات تأتي من data.rsd عبر fetch
       ============================================================ */
    :root {
      --green: #1DB954;
      --green-dark: #168A3E;
      --green-soft: #E9F9EF;
      --dark: #1F2328;
      --muted: #6B7280;
      --light: #F4F6F4;
      --line: #E1E7E2;
      --wrong: #FF3B30;
      --white: #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
      background: var(--light);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ---------- الشريط العلوي ---------- */
    .top-bar {
      background: var(--dark);
      color: #ddd;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .logo {
      color: var(--green);
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
    }
    .logo:hover { color: #fff; }
    #headerInfo { font-weight: 700; font-size: 13px; text-align: center; flex: 1; }
    .top-actions { display: flex; gap: 10px; align-items: center; }

    /* ---------- الحاوية والشاشات ---------- */
    .main-content { flex: 1; padding: 24px; display: flex; justify-content: center; }
    .screen { display: none; width: 100%; max-width: 1100px; flex-direction: column; align-items: center; }
    .screen.active { display: flex; }
    h1, h2 { margin-bottom: 20px; color: var(--dark); }
    h1 { font-size: 28px; }
    h2 { font-size: 22px; }

    /* ---------- شاشة المنهج ---------- */
    .curriculum-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      width: 100%;
    }
    .unit-card {
      background: var(--green);
      color: #fff;
      border-radius: 14px;
      padding: 22px;
      min-height: 150px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      transition: transform .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .unit-card:nth-child(2) { background: #2E86C1; }
    .unit-card:nth-child(3) { background: #8E44AD; }
    .unit-card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,0.18); }
    .unit-card h3 { font-size: 20px; z-index: 2; }
    .unit-card p { font-size: 12px; opacity: .9; z-index: 2; }
    .unit-badge {
      align-self: flex-start;
      background: rgba(255,255,255,.25);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      z-index: 2;
    }

    /* ---------- شاشة المسار ---------- */
    .path-container {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .node {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #E5E9E6;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: .2s;
    }
    .node:hover { transform: scale(1.08); }
    .node.active { background: var(--green); color: #fff; box-shadow: 0 0 0 5px var(--green-soft); }
    .node.completed { background: var(--green-dark); color: #fff; }

    .polaroid-strip {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }
    .polaroid {
      background: #fff;
      padding: 8px 8px 24px;
      box-shadow: 0 5px 14px rgba(0,0,0,.18);
      transition: transform .25s;
    }
    .polaroid:nth-child(1) { transform: rotate(-5deg); }
    .polaroid:nth-child(2) { transform: rotate(3deg); }
    .polaroid:nth-child(3) { transform: rotate(-2deg); }
    .polaroid:nth-child(4) { transform: rotate(5deg); }
    .polaroid:nth-child(5) { transform: rotate(-3deg); }
    .polaroid:hover { transform: scale(1.1) rotate(0); z-index: 5; }
    .polaroid img { width: 120px; height: 120px; object-fit: cover; display: block; background: #eee; }

    /* ---------- شاشة التمارين ---------- */
    .exercise-wrap { width: 100%; max-width: 820px; display: flex; flex-direction: column; align-items: center; }
    .exercise-meta { font-size: 13px; color: var(--muted); font-weight: 800; margin-bottom: 12px; }

    .card {
      width: 100%;
      background: var(--white);
      border: 3px solid transparent;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      overflow: hidden;
      transition: border-color .2s, transform .2s;
    }
    .card.correct { border-color: var(--green); }
    .card.wrong { border-color: var(--wrong); animation: shake .4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    .exercise-header {
      padding: 20px;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .blank-input {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 18px;
      width: 130px;
      text-align: center;
      margin: 0 6px;
      outline: none;
    }
    .blank-input:focus { border-color: var(--green); background: var(--green-soft); }

    .audio-btn {
      border: 2px solid var(--green);
      background: var(--white);
      color: var(--green);
      border-radius: 50%;
      width: 38px; height: 38px;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .audio-btn:hover { background: var(--green); color: #fff; }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 16px;
    }
    .choice {
      border: 3px solid var(--line);
      border-radius: 10px;
      padding: 0;
      background: #fff;
      cursor: pointer;
      overflow: hidden;
      transition: transform .15s, border-color .15s;
    }
    .choice:hover { transform: translateY(-3px); }
    .choice img { width: 100%; height: 100px; object-fit: cover; display: block; }
    .choice.selected { border-color: var(--green); }
    .choice.is-correct { border-color: var(--green); background: var(--green-soft); }
    .choice.is-wrong { border-color: var(--wrong); background: #FFEAEA; }

    .text-options { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .text-option {
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #fff;
      text-align: left;
      transition: .15s;
    }
    .text-option:hover { border-color: var(--green); background: var(--green-soft); }
    .text-option.is-correct { border-color: var(--green); background: var(--green-soft); }
    .text-option.is-wrong { border-color: var(--wrong); background: #FFEAEA; }

    .card-image { width: 100%; max-height: 300px; object-fit: cover; display: block; background: #eee; }

    .next-btn {
      margin-top: 22px;
      background: var(--green);
      color: #fff;
      border: 0;
      border-radius: 30px;
      padding: 13px 46px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: none;
      box-shadow: 0 6px 16px rgba(29,185,84,.3);
    }
    .next-btn.show { display: block; }
    .next-btn:hover { background: var(--green-dark); }

    .back-btn {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }
    .back-btn:hover { border-color: var(--green); color: var(--green); }

    .error-box {
      background: #fff;
      border: 2px solid var(--wrong);
      color: var(--wrong);
      padding: 18px;
      border-radius: 12px;
      font-weight: 800;
    }

    /* ---------- تجاوب الشاشة ---------- */
    @media (max-width: 860px) {
      .curriculum-grid { grid-template-columns: 1fr; }
      .choice-grid { grid-template-columns: repeat(2, 1fr); }
      .exercise-header { font-size: 17px; }
      .polaroid img { width: 90px; height: 90px; }
    }
    @media (max-width: 520px) {
      .main-content { padding: 14px; }
      .top-bar { padding: 10px 12px; }
      #headerInfo { font-size: 11px; }
      .choice-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .choice img { height: 80px; }
      .node { width: 42px; height: 42px; }
    }
  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <div class="top-bar">
    <div class="logo" onclick="showScreen('curriculumScreen')">● Lingo Gold</div>
    <div id="headerInfo">Loading...</div>
    <div class="top-actions">
      <button class="back-btn" onclick="goBack()">Back</button>
      <span>Sign Out</span>
    </div>
  </div>

  <div class="main-content">

    <!-- 1) شاشة المنهج -->
    <section id="curriculumScreen" class="screen active">
      <h1>Select a Unit</h1>
      <div class="curriculum-grid" id="curriculumGrid"></div>
    </section>

    <!-- 2) شاشة المسار -->
    <section id="dashboardScreen" class="screen">
      <h2 id="dashboardTitle">Unit</h2>
      <div class="path-container" id="pathContainer"></div>
      <div class="polaroid-strip" id="polaroidStrip"></div>
    </section>

    <!-- 3) شاشة التمارين -->
    <section id="exerciseScreen" class="screen">
      <div class="exercise-wrap">
        <div class="exercise-meta" id="exerciseMeta"></div>
        <div id="exerciseContainer"></div>
        <button class="next-btn" id="nextBtn" onclick="nextExercise()">Next ➔</button>
      </div>
    </section>

  </div>

  <script>
    /* ============================================================
       حالة التطبيق
       ============================================================ */
    let appData = null;
    let selectedUnit = 0;
    let selectedLesson = 0;
    let currentExercise = 0;

    const $ = (id) => document.getElementById(id);

    /* ---------- تحميل البيانات ---------- */
    fetch('data.rsd')
      .then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then((data) => {
        appData = data;
        $('headerInfo').textContent = data.language + ' • ' + data.title;
        buildCurriculum();
      })
      .catch((err) => {
        $('curriculumGrid').innerHTML =
          '<div class="error-box">تعذّر تحميل data.rsd. شغّل عبر خادم محلي (Live Server). ' + err.message + '</div>';
        console.error(err);
      });

    /* ---------- التنقل بين الشاشات ---------- */
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
      $(id).classList.add('active');
    }

    function goBack() {
      const active = document.querySelector('.screen.active').id;
      if (active === 'exerciseScreen') {
        showScreen('dashboardScreen');
        buildDashboard();
      } else if (active === 'dashboardScreen') {
        showScreen('curriculumScreen');
      }
    }

    /* ---------- 1) بناء شاشة المنهج ---------- */
    function buildCurriculum() {
      const grid = $('curriculumGrid');
      grid.innerHTML = '';

      appData.units.forEach((unit, index) => {
        const card = document.createElement('div');
        card.className = 'unit-card';
        card.innerHTML = `
          <span class="unit-badge">${unit.lessons.length} Lessons</span>
          <div>
            <h3>${unit.title}</h3>
            <p>Click to start learning</p>
          </div>
        `;
        card.onclick = () => openUnit(index);
        grid.appendChild(card);
      });
    }

    /* ---------- 2) بناء شاشة المسار ---------- */
    function openUnit(index) {
      selectedUnit = index;
      showScreen('dashboardScreen');
      buildDashboard();
    }

    function buildDashboard() {
      const unit = appData.units[selectedUnit];
      $('dashboardTitle').textContent = unit.title;
      $('headerInfo').textContent = unit.title;
      $('pathContainer').innerHTML = '';

      unit.lessons.forEach((lesson, i) => {
        const node = document.createElement('div');
        node.className = 'node' + (i === 0 ? ' active' : '');
        node.textContent = i + 1;
        node.title = lesson.title;
        node.onclick = () => startLesson(i);
        $('pathContainer').appendChild(node);
      });

      // شريط صور من الصور المرقمة
      const strip = $('polaroidStrip');
      strip.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const p = document.createElement('div');
        p.className = 'polaroid';
        p.innerHTML = `<img src="media/${i}.jpg" alt="Lesson photo">`;
        strip.appendChild(p);
      }
    }

    /* ---------- 3) شاشة التمارين ---------- */
    function startLesson(lessonIndex) {
      selectedLesson = lessonIndex;
      currentExercise = 0;
      showScreen('exerciseScreen');
      renderExercise();
    }

    function currentEx() {
      return appData.units[selectedUnit].lessons[selectedLesson].exercises[currentExercise];
    }

    function normalize(v) {
      return String(v || '').trim().toLowerCase();
    }

    function speak(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = 'en-US';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    function markCorrect(card) {
      card.classList.remove('wrong');
      card.classList.add('correct');
      $('nextBtn').classList.add('show');
    }

    function markWrong(card) {
      card.classList.remove('correct');
      card.classList.add('wrong');
      setTimeout(() => card && card.classList.remove('wrong'), 500);
    }

    function renderExercise() {
      const ex = currentEx();
      const lesson = appData.units[selectedUnit].lessons[selectedLesson];
      const container = $('exerciseContainer');
      container.innerHTML = '';
      $('nextBtn').classList.remove('show');
      $('exerciseMeta').textContent =
        `${lesson.title} • Exercise ${currentExercise + 1} of ${lesson.exercises.length}`;
      $('headerInfo').textContent = lesson.title;

      const card = document.createElement('div');
      card.className = 'card';

      if (ex.type === 'fill_blank') {
        const parts = String(ex.sentence).split('___');
        card.innerHTML = `
          <div class="exercise-header">
            <div>${parts[0] || ''}<input class="blank-input" id="blankInput" autocomplete="off" placeholder="...">${parts[1] || ''}</div>
            <button class="audio-btn" id="audioBtn">▶</button>
          </div>
          <img class="card-image" src="${ex.image}" alt="Exercise image">
        `;
        container.appendChild(card);

        const input = $('blankInput');
        input.addEventListener('input', () => {
          if (normalize(input.value) === normalize(ex.answer)) {
            markCorrect(card);
            speak(ex.answer);
          } else if (input.value.trim() !== '') {
            markWrong(card);
          } else {
            card.classList.remove('correct', 'wrong');
          }
        });
        $('audioBtn').onclick = () => speak(ex.sentence.replace('___', ex.answer));
      }

      else if (ex.type === 'choose_image') {
        const correctIndex = ex.options.indexOf(ex.answer);
        let html = `
          <div class="exercise-header">
            <span>🔊 ${ex.question}</span>
            <button class="audio-btn" id="audioBtn">▶</button>
          </div>
          <div class="choice-grid">
        `;
        ex.options.forEach((src, i) => {
          html += `<button class="choice" data-i="${i}"><img src="${src}" alt="Option ${i + 1}"></button>`;
        });
        html += `</div>`;
        card.innerHTML = html;
        container.appendChild(card);

        card.querySelectorAll('.choice').forEach((btn) => {
          btn.onclick = () => {
            const i = Number(btn.dataset.i);
            card.querySelectorAll('.choice').forEach((b) => b.classList.remove('selected', 'is-correct', 'is-wrong'));
            btn.classList.add('selected');
            if (i === correctIndex) {
              btn.classList.add('is-correct');
              markCorrect(card);
              speak(ex.answer);
            } else {
              btn.classList.add('is-wrong');
              markWrong(card);
            }
          };
        });
        $('audioBtn').onclick = () => speak(ex.question);
      }

      else if (ex.type === 'choose_text') {
        const correctIndex = ex.options.indexOf(ex.answer);
        let html = `
          <div class="exercise-header">
            <span>Choose the correct sentence</span>
            <button class="audio-btn" id="audioBtn">▶</button>
          </div>
          <img class="card-image" src="${ex.image}" alt="Exercise image">
          <div class="text-options">
        `;
        ex.options.forEach((text, i) => {
          html += `<button class="text-option" data-i="${i}">${text}</button>`;
        });
        html += `</div>`;
        card.innerHTML = html;
        container.appendChild(card);

        card.querySelectorAll('.text-option').forEach((btn) => {
          btn.onclick = () => {
            const i = Number(btn.dataset.i);
            card.querySelectorAll('.text-option').forEach((b) => b.classList.remove('is-correct', 'is-wrong'));
            if (i === correctIndex) {
              btn.classList.add('is-correct');
              markCorrect(card);
              speak(ex.answer);
            } else {
              btn.classList.add('is-wrong');
              markWrong(card);
            }
          };
        });
        $('audioBtn').onclick = () => speak(ex.answer);
      }
    }

    /* ---------- الانتقال للتمرين التالي ---------- */
    function nextExercise() {
      const lesson = appData.units[selectedUnit].lessons[selectedLesson];
      currentExercise++;
      if (currentExercise < lesson.exercises.length) {
        renderExercise();
      } else {
        alert('Lesson Completed!');
        showScreen('dashboardScreen');
        buildDashboard();
      }
    }
  </script>
</body>
</html>
