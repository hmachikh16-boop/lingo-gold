<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingo Gold — Classic Lesson</title>
<style>
:root{--bg:#d4d3ce;--panel:#e7e6e1;--line:#9b9a94;--dark:#4c4c48;--gold:#9b8144;--text:#282927}
*{box-sizing:border-box}body{margin:0;background:#c9c9c4;color:var(--text);font:13px Tahoma,Arial,sans-serif}
.app{height:100vh;min-height:600px;display:flex;flex-direction:column;background:linear-gradient(#dad9d4,#c9c8c2);border:1px solid #777}
.top{height:35px;background:linear-gradient(#f2f1ed,#d6d5cf);border-bottom:1px solid #a5a49d;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.logo{font-weight:bold;letter-spacing:2px;color:#92773b;font-size:16px}.topmeta{color:#666;font-size:11px}
.units{height:78px;display:flex;align-items:stretch;padding:7px 10px;gap:7px;background:linear-gradient(#e5e4df,#c9c8c2);border-bottom:1px solid #a5a49d}
.unit{width:140px;display:flex;align-items:center;gap:7px;border:1px solid #aaa9a2;background:linear-gradient(#f4f3ef,#d4d3cc);padding:5px;color:#4c4b47;font-size:11px;cursor:pointer}
.unit img{width:48px;height:54px;object-fit:cover;border:1px solid #999}.unit.active{border:2px solid #98804b;background:linear-gradient(#f7f6f2,#deddd6)}
.course{height:35px;display:flex;align-items:center;background:linear-gradient(#f0efeb,#d4d3cd);border-bottom:1px solid #aaa9a3;padding:0 12px;gap:18px;font-size:11px;color:#555}
.course .selected{font-weight:bold;color:#8d7339;border-bottom:2px solid #a28a55;height:100%;display:flex;align-items:center;padding:0 7px}
.work{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:12px 3vw 8px;gap:9px}
.prompt{height:42px;width:min(100%,900px);background:linear-gradient(#fff,#f0efeb);border:1px solid #aaa9a3;display:flex;align-items:center;justify-content:center;font-size:18px;color:#333;position:relative}
.sound{position:absolute;right:8px;top:5px;height:30px;width:32px;border:1px solid #aaa;background:linear-gradient(#fff,#ddd);cursor:pointer;color:#555}
.grid{width:min(100%,920px);flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
.choice{border:2px solid #a8a7a1;background:#eee;position:relative;overflow:hidden;cursor:pointer;min-height:0}
.choice img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.88)}.choice:hover{border-color:#777}.choice.selected{border:4px solid #9a8047}.choice.correct{border:4px solid #6f8d64}.choice.wrong{border:4px solid #a35c56}
.controls{height:36px;width:min(100%,920px);display:flex;align-items:center;justify-content:space-between;color:#5c5b55;font-size:11px}
.pips{display:flex;gap:5px;align-items:center}.pip{width:17px;height:17px;border:1px solid #aaa;background:linear-gradient(#eee,#ccc);text-align:center;line-height:15px;cursor:pointer}.pip.active{background:#9a8047;color:white;border-color:#77643b}
.bottom{height:44px;background:linear-gradient(#deddd7,#c4c3bd);border-top:1px solid #9d9c96;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.btn{background:linear-gradient(#f7f6f2,#d3d2cc);border:1px solid #9d9c96;padding:6px 14px;color:#4d4c47;cursor:pointer;font-size:11px}.btn:hover{background:#f7f6f2}.status{font-size:11px;color:#696862}
@media(max-width:650px){.app{min-height:480px}.units{height:66px;overflow-x:auto}.unit{min-width:110px;width:110px}.unit img{width:36px;height:46px}.course{gap:10px;overflow:hidden;white-space:nowrap}.work{padding:8px 8px 5px}.prompt{font-size:15px;height:40px}.grid{gap:5px}.bottom{height:40px;padding:0 7px}.btn{padding:6px 9px}.controls{height:30px}}
</style></head>
<body><div class="app">
<header class="top"><div class="logo">LINGO GOLD</div><div class="topmeta">ENGLISH COURSE&nbsp; · &nbsp;LEVEL 1</div></header>
<nav class="units" aria-label="Units">
<div class="unit active"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=160&q=80"><span>UNIT 1<br>Greetings</span></div>
<div class="unit"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=160&q=80"><span>UNIT 2<br>People</span></div>
<div class="unit"><img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=160&q=80"><span>UNIT 3<br>Everyday</span></div>
<div class="unit"><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=160&q=80"><span>UNIT 4<br>Places</span></div>
</nav>
<nav class="course"><span>Course</span><span>Lesson 1</span><span class="selected" id="activityName">Core Lesson</span><span>Practice</span><span>Review</span></nav>
<main class="work"><div class="prompt"><span id="sentence">The woman is drinking.</span><button class="sound" id="audio" title="Play audio">▶</button></div>
<div class="grid" id="choices"></div>
<div class="controls"><div class="pips" id="pips"></div><span id="status">Select the picture that matches.</span><span>Screen <b id="screenNo">1</b> / 6</span></div></main>
<footer class="bottom"><button class="btn" id="answers">Answers</button><div class="status" id="feedback">Choose one picture.</div><div><button class="btn" id="back">‹ Back</button> <button class="btn" id="advance">Advance ›</button></div></footer>
</div>
<script>
const rounds=[
{sentence:'The woman is drinking.',correct:0,photos:['photo-1544145945-f90425340c7e','photo-1544005313-94ddf0286df2','photo-1500648767791-00dcc994a43e','photo-1517841905240-472988babdf9']},
{sentence:'The man is walking.',correct:2,photos:['photo-1517841905240-472988babdf9','photo-1544005313-94ddf0286df2','photo-1552674605-db6ffd4facb5','photo-1500648767791-00dcc994a43e']},
{sentence:'The boy is running.',correct:1,photos:['photo-1500648767791-00dcc994a43e','photo-1552674605-db6ffd4facb5','photo-1517841905240-472988babdf9','photo-1544145945-f90425340c7e']},
{sentence:'The woman is reading.',correct:3,photos:['photo-1544145945-f90425340c7e','photo-1500648767791-00dcc994a43e','photo-1552674605-db6ffd4facb5','photo-1519681393784-d120267933ba']},
{sentence:'The man is eating.',correct:0,photos:['photo-1544145945-f90425340c7e','photo-1517841905240-472988babdf9','photo-1500648767791-00dcc994a43e','photo-1552674605-db6ffd4facb5']},
{sentence:'The child is playing.',correct:2,photos:['photo-1544005313-94ddf0286df2','photo-1500648767791-00dcc994a43e','photo-1552674605-db6ffd4facb5','photo-1517841905240-472988babdf9']}
];
let idx=0,chosen=false,answered=false;const $=id=>document.getElementById(id);
function url(id){return 'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w=900&q=85'}
function render(){let r=rounds[idx];chosen=false;answered=false;$('sentence').textContent=r.sentence;$('feedback').textContent='Choose one picture.';$('status').textContent='Select the picture that matches.';$('screenNo').textContent=idx+1;$('advance').disabled=false;$('choices').innerHTML='';r.photos.forEach((p,i)=>{let el=document.createElement('div');el.className='choice';el.innerHTML='<img alt="Picture choice" src="'+url(p)+'">';el.onclick=()=>select(i,el);$('choices').appendChild(el)});$('pips').innerHTML='';rounds.forEach((_,i)=>{let pip=document.createElement('button');pip.className='pip'+(i===idx?' active':'');pip.textContent=i+1;pip.onclick=()=>{idx=i;render()};$('pips').appendChild(pip)})}
function select(i,el){if(chosen)return;let r=rounds[idx];if(i===r.correct){chosen=true;el.classList.add('correct');$('feedback').textContent='Correct';$('status').textContent='Correct answer';}else{el.classList.add('wrong');$('feedback').textContent='Try again';setTimeout(()=>el.classList.remove('wrong'),550)}}
$('audio').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(rounds[idx].sentence);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)};
$('advance').onclick=()=>{if(!chosen){$('feedback').textContent='Choose the correct picture first.';return}idx=(idx+1)%rounds.length;render()};$('back').onclick=()=>{idx=(idx-1+rounds.length)%rounds.length;render()};$('answers').onclick=()=>{$('feedback').textContent='Correct picture: '+(rounds[idx].correct+1)};
render();
</script></body></html>
