<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingo Gold — Visual Immersion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="loading" id="loading"><div style="text-align:center"><div style="font-size:36px">🌊</div><div class="status" style="margin-top:8px">Loading lessons...</div></div></div>

  <div id="home">
    <header class="top">
      <div class="logo"><i>LG</i><span>Lingo Gold</span></div>
      <div class="prog" id="progress">0 / 48</div>
    </header>
    <div class="shell">
      <aside class="side"><h4>LEVELS</h4><div id="side"></div></aside>
      <main class="mainbox">
        <h1 id="title">Unit</h1>
        <div class="sub" id="titleSub">Visual immersion · English only</div>
        <div class="headrow"><h2>LESSONS</h2><span>Learn through context</span></div>
        <div class="path" id="path"></div>
        <div class="headrow"><h2>ASSESSMENT</h2><span>75% to pass</span></div>
        <div class="tools" id="tools"></div>
      </main>
    </div>
  </div>

  <section class="stage" id="stage">
    <div class="bar">
      <button class="exit" id="exit" title="Exit">✕</button>
      <div class="track" id="pieces"></div>
      <div class="kind" id="kind">OBSERVE</div>
      <div class="count" id="count">1/9</div>
    </div>
    <div class="viewport"><div class="wrap" id="wrap"></div></div>
    <div class="foot"><div class="mark" id="mark"></div><button class="next" id="next" disabled>Next →</button></div>
  </section>

  <section class="stage" id="testModal">
    <div class="bar"><button class="exit" id="texit">✕</button><div class="track"></div><div class="kind">TEST</div></div>
    <div class="viewport"><div class="wrap" id="testWrap"></div></div>
  </section>

  <section class="stage" id="reviewModal">
    <div class="bar"><button class="exit" id="rexit">✕</button><div class="track"></div><div class="kind">REVIEW</div></div>
    <div class="viewport"><div class="wrap" id="reviewWrap"></div></div>
  </section>

  <div class="toast" id="toast"></div>
  <script src="curriculum.js"></script>
  <script src="app.js"></script>
</body>
</html>
