<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Gold — Rosetta Style</title>

  <!-- ملف التصميم الخارجي -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= الشريط العلوي ================= -->
  <header class="header">
    <div class="header-left">
      <!-- الشعار الأخضر -->
      <div class="logo">Lingo Gold</div>

      <!-- التنقل: اللغة + مكان الدرس -->
      <div class="header-nav">
        <span id="languageLabel">English (American)</span>
        <span class="divider">|</span>
        <span id="breadcrumb">Unit 1 - Lesson 2 &gt; Grammar</span>
      </div>
    </div>

    <!-- أيقونات الجانب الأيمن -->
    <div class="header-right">
      <a class="dash-link" href="dashboard.html">Dashboard</a>
      <a class="dash-link" href="curriculum.html">Curriculum</a>
      <span class="icon">🔊</span>
      <span class="icon">🔒</span>
      <span class="signout">Sign Out</span>
    </div>
  </header>

  <!-- ================= شريط حالة الخطوات (نقاط) ================= -->
  <div class="status-bar" id="statusBar" aria-label="Lesson progress">
    <!-- تُنشأ النقاط تلقائياً من app.js حسب عدد الأسئلة -->
  </div>

  <!-- ================= منطقة البطاقات ================= -->
  <main class="main-container">
    <!-- تُبنى البطاقات الأربع تلقائياً بواسطة app.js من ملف data.rsd -->
    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <!-- ================= الشريط السفلي ================= -->
  <footer class="footer">
    <div class="footer-dots" id="footerDots"></div>
    <button class="reset-btn" id="resetBtn" type="button">Reset</button>
  </footer>

  <!-- سكربت التطبيق (defer يضمن تنفيذها بعد بناء الـ DOM) -->
  <script src="app.js" defer></script>

  <script>
    /* ============================================================
       الخطوة 1: تحديث ملف التمارين
       يتأكد هذا الكود من إكمال الدرس، يحفظ الحالة في المتصفح،
       ثم يعيد التوجيه إلى لوحة التحكم بعد ثانية واحدة.
       ============================================================ */

    // رقم الدرس الحالي (النقطة الرابعة في المسار)
    const currentLessonId = 4;

    function completeLesson() {
      // حفظ حالة الإكمال في ذاكرة المتصفح (تبقى بعد إغلاق الصفحة)
      localStorage.setItem('lesson_' + currentLessonId, 'completed');

      // انتقال تلقائي إلى لوحة التحكم بعد ثانية
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    }

    // إنشاء زر الإنهاء في أسفل الصفحة
    const finishBtn = document.createElement('button');
    finishBtn.innerText = 'إنهاء الدرس والعودة للمسار';
    finishBtn.style =
      'position: fixed; bottom: 20px; right: 20px; padding: 15px; ' +
      'background: #1DB954; color: white; border: none; border-radius: 5px; ' +
      'cursor: pointer; font-size: 16px; z-index: 100;';
    finishBtn.onclick = completeLesson;
    document.body.appendChild(finishBtn);
  </script>
</body>
</html>
