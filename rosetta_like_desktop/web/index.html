<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rosetta_like_desktop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>rosetta_like_desktop</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window._lingoTranscript = '';
    window.lingoStartListening = function () {
      window._lingoTranscript = '';
      var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) return false;
      try {
        var recognition = new Recognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.onresult = function (event) {
          window._lingoTranscript = event.results[0][0].transcript || '';
        };
        recognition.start();
        return true;
      } catch (e) {
        return false;
      }
    };
    window.lingoGetTranscript = function () { return window._lingoTranscript || ''; };
    window.lingoLoadProgress = function () {
      try { return localStorage.getItem('lingo_replica_progress') || ''; } catch (e) { return ''; }
    };
    window.lingoSaveProgress = function (xp, stars) {
      try { localStorage.setItem('lingo_replica_progress', xp + ':' + stars); } catch (e) {}
    };
    window.lingoSpeak = function (text) {
      try {
        if (!('speechSynthesis' in window)) return false;
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(String(text));
        utterance.lang = 'en-US';
        utterance.rate = 0.78;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
        return true;
      } catch (e) {
        return false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
