<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #fbf0d7 0%, #efd9ad 55%, #e8d9b0 100%);
    color: #2c2114;
    display: flex;
    align-items: center;
    padding: 40px 56px;
    gap: 48px;
  }
  .logo {
    width: 168px; height: 168px;
    border-radius: 36px;
    background: linear-gradient(160deg, #3a2a18, #2c2114);
    box-shadow: 0 18px 40px rgba(44,33,20,0.28), inset 0 1px 0 rgba(255,240,210,0.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo svg { width: 96px; height: 96px; }
  .content { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .brand { font-size: 58px; font-weight: 900; color: #2c2114; letter-spacing: -1px; line-height: 1; }
  .brand span { color: #a56c18; }
  .tagline { font-size: 24px; color: #5b4730; font-weight: 600; margin-top: 6px; }
  .features { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; }
  .chip {
    background: #f4e8cc; border: 1px solid #d8c49a; color: #2c2114;
    padding: 8px 16px; border-radius: 999px; font-size: 17px; font-weight: 700;
    box-shadow: 0 2px 6px rgba(44,33,20,0.08);
  }
  .footer {
    margin-top: 14px; font-size: 16px; color: #5b4730; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .badge { background: #a56c18; color: #fbf0d7; padding: 6px 14px; border-radius: 999px; font-size: 15px; font-weight: 800; }
  .corner {
    position: absolute; top: 0; left: 0; width: 1024px; height: 500px; pointer-events: none;
    background: radial-gradient(circle at 90% 10%, rgba(165,108,24,0.10), transparent 40%),
                radial-gradient(circle at 10% 90%, rgba(141,47,36,0.08), transparent 40%);
  }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fbf0d7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      <path d="M8 7h8M8 11h6"/>
    </svg>
  </div>
  <div class="content">
    <div class="brand">Lin <span>Go</span></div>
    <div class="tagline">تعلّم الإنجليزية والفرنسية بخطوة كل يوم</div>
    <div class="features">
      <span class="chip">740 درساً</span>
      <span class="chip">58 قصة</span>
      <span class="chip">نطق وتكرار</span>
      <span class="chip">بطاقات مفردات</span>
      <span class="chip">اختبارات</span>
      <span class="chip">يعمل دون اتصال</span>
    </div>
    <div class="footer">
      <span class="badge">مجاني</span>
      <span>مسار كامل • محادثات كرتونية • معلّم ذكي • نسخ احتياطي مشفّر</span>
    </div>
  </div>
</body>
</html>
