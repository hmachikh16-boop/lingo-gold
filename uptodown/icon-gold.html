<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, #fbf0d7 0%, #efd9ad 60%, #e8d9b0 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo {
    width: 360px; height: 360px;
    border-radius: 76px;
    background: linear-gradient(160deg, #5a3e12, #2c2114);
    box-shadow: 0 24px 60px rgba(44,33,20,0.30), inset 0 2px 0 rgba(255,240,210,0.20);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo svg { width: 200px; height: 200px; }
  .gold-badge {
    position: absolute; bottom: -18px; right: -18px;
    background: linear-gradient(135deg, #c98a2a, #a56c18);
    color: #fbf0d7;
    padding: 10px 22px; border-radius: 999px; font-size: 30px; font-weight: 900;
    box-shadow: 0 6px 16px rgba(44,33,20,0.30);
    border: 3px solid #fbf0d7;
  }
  .corner {
    position: absolute; top: 0; left: 0; width: 512px; height: 512px; pointer-events: none;
    background: radial-gradient(circle at 85% 15%, rgba(165,108,24,0.15), transparent 45%),
                radial-gradient(circle at 15% 85%, rgba(141,47,36,0.10), transparent 45%);
  }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fbf0d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      <path d="M8 7h8M8 11h6"/>
    </svg>
    <span class="gold-badge">Gold+</span>
  </div>
</body>
</html>
