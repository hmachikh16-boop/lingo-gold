<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingo Gold - Dashboard</title>
    <style>
        /* ============================================================
           لوحة تحكم Lingo Gold — مبنية على كود التصميم المرفق
           التعديلات: هوية خضراء + صور محلية + تصميم متجاوب
           ============================================================ */

        /* الألوان الأساسية */
        :root {
            --green: #1DB954;
            --green-dark: #168A3E;
            --dark: #333333;
            --dark-2: #2c3e50;
            --gray: #666666;
            --light: #e5e5e5;
        }

        /* إعدادات عامة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ================= الشريط العلوي (الوحدات) ================= */
        .top-nav {
            background: var(--dark);
            display: flex;
            height: 80px;
            overflow-x: auto; /* يسمح بالتمرير أفقياً على الشاشات الصغيرة */
        }

        .nav-item {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ccc;
            cursor: pointer;
            border-right: 1px solid #444;
            transition: 0.3s;
        }

        .nav-item:hover {
            background: #444;
            color: #fff;
        }

        /* الوحدة النشطة تظهر بالأخضر */
        .nav-item.active {
            background: #555;
            color: #fff;
            border-bottom: 4px solid var(--green);
        }

        .nav-item h3 {
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 5px;
        }

        /* ================= شريط الحالة ================= */
        .status-bar {
            background: var(--dark-2);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 12px;
        }

        .logo {
            color: var(--green);
            font-weight: 800;
            font-size: 17px;
        }

        .dash-link {
            color: #fff;
            text-decoration: none;
            margin-right: 10px;
        }

        /* ================= المنطقة الرئيسية ================= */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            overflow-y: auto; /* يسمح بالتمرير عمودياً إذا قلت المساحة */
        }

        /* بطاقة الدرس الأساسي */
        .core-lesson-card {
            background: #d1c7b7;
            border-radius: 10px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            width: 600px;
            max-width: 100%;
        }

        .core-icon {
            background: var(--green);
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
        }

        .core-text h2 { font-size: 18px; color: #333; }
        .core-text p { font-size: 12px; color: var(--gray); margin-top: 4px; }

        /* زر البدء يفتح شاشة الدرس الحالية */
        .start-btn {
            margin-left: auto;
            background: #e0e0e0;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            text-decoration: none;
            color: #333;
            transition: 0.2s;
        }

        .start-btn:hover {
            background: var(--green);
            color: #fff;
        }

        /* ================= مسار التقدم ================= */
        .progress-path {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 50px;
            position: relative;
            width: 80%;
            max-width: 700px;
            justify-content: center;
        }

        .path-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #ccc;
            z-index: 1;
        }

        .node {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #999;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            font-size: 12px;
            color: #999;
        }

        /* dash مكتملة */
        .node.completed {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }

        /* الوحدة الحالية */
        .node.current {
            background: var(--green-dark);
            border-color: var(--green-dark);
            color: #fff;
            box-shadow: 0 0 10px rgba(29, 185, 84, 0.5);
        }

        /* الوحدات المقفلة */
        .node.locked {
            background: #fff;
            border-color: #ccc;
            color: #ccc;
        }

        /* النص الإرشادي */
        .instruction-text {
            color: var(--gray);
            font-size: 18px;
            margin-bottom: 40px;
            font-style: italic;
        }

        /* ================= الصور المائلة (Polaroids) ================= */
        .polaroid-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            padding: 20px;
            flex-wrap: wrap; /* تلتف على شاشات الجوال */
        }

        .polaroid {
            background: #fff;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            cursor: pointer;
        }

        /* ميلان بسيط لكل صورة لمحاكاة الشكل الأصلي */
        .polaroid:nth-child(1) { transform: rotate(-5deg); }
        .polaroid:nth-child(2) { transform: rotate(3deg); }
        .polaroid:nth-child(3) { transform: rotate(-2deg); }
        .polaroid:nth-child(4) { transform: rotate(6deg); }
        .polaroid:nth-child(5) { transform: rotate(-4deg); }

        .polaroid:hover {
            transform: scale(1.1) rotate(0deg);
            z-index: 10;
        }

        .polaroid img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            background: #ddd;
            display: block;
        }

        /* ================= الشريط السفلي ================= */
        .bottom-bar {
            background: var(--dark);
            color: #ccc;
            padding: 10px;
            text-align: center;
            font-size: 12px;
        }

        /* ================= تجاوب الشاشة ================= */
        @media (max-width: 760px) {
            .top-nav { height: auto; }
            .nav-item { min-width: 150px; padding: 12px; }
            .core-lesson-card { flex-direction: column; text-align: center; }
            .start-btn { margin-left: 0; }
            .polaroid img { width: 110px; height: 110px; }
            .instruction-text { text-align: center; }
        }
    </style>
</head>
<body>

    <!-- شريط الحالة العلوي -->
    <div class="status-bar">
        <div class="logo">Lingo Gold</div>
        <div>English (American) — Level 1</div>
        <div>
            <a href="index.html" class="dash-link">Lesson</a>
            🔊 🔒 Sign Out
        </div>
    </div>

    <!-- قائمة الوحدات العلوية -->
    <div class="top-nav">
        <div class="nav-item"><h3>Unit 1: Basics</h3></div>
        <div class="nav-item"><h3>Unit 2: People</h3></div>
        <div class="nav-item active"><h3>Unit 3: Friends and Social Life</h3></div>
        <div class="nav-item"><h3>Unit 4: Food and Travel</h3></div>
    </div>

    <!-- المنطقة الرئيسية -->
    <div class="main-area">

        <!-- بطاقة الدرس: الزر يفتح شاشة الدرس الحالية index.html -->
        <div class="core-lesson-card">
            <div class="core-icon">!</div>
            <div class="core-text">
                <h2>Core Lesson</h2>
                <p>About 30 minutes</p>
            </div>
            <a class="start-btn" href="index.html">Start ▶</a>
        </div>

        <!-- مسار التقدم: مكتمل / حالي / مقفل -->
        <div class="progress-path">
            <div class="path-line"></div>
            <div class="node completed">✓</div>
            <div class="node completed">✓</div>
            <div class="node completed">✓</div>
            <div class="node current">★</div>
            <div class="node locked">🔒</div>
            <div class="node locked">🔒</div>
            <div class="node locked">🔒</div>
            <div class="node locked">🔒</div>
        </div>

        <div class="instruction-text">Your selected course for Unit 3</div>

        <!-- الصور المائلة: صور محلية من مجلد media/images -->
        <div class="polaroid-container">
            <div class="polaroid"><img src="media/images/img_one_dog.jpg" alt="Dog"></div>
            <div class="polaroid"><img src="media/images/img_four_boys.jpg" alt="Kids"></div>
            <div class="polaroid"><img src="media/images/img_five_newspapers.jpg" alt="Newspapers"></div>
            <div class="polaroid"><img src="media/images/img_house.jpg" alt="House"></div>
            <div class="polaroid"><img src="media/images/img_market.jpg" alt="Market"></div>
        </div>

    </div>

    <!-- الشريط السفلي -->
    <div class="bottom-bar">
        Explore all activities for Unit 3
    </div>

</body>
</html>
